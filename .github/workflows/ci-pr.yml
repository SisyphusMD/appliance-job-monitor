name: CI (pull requests)

# Forgejo is the source of truth and runs CI on every push, but issues and pull requests live on
# the GitHub mirror. This runs the same checks for the pull request surface, on GitHub's hosted
# runners, so a contributor's change is tested before review.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and repository checks
    # Forgejo Actions also reads .github/workflows; without this the same jobs would run twice there.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the linters
        env:
          # renovate: datasource=pypi depName=yamllint
          YAMLLINT: "1.37.1"
          # renovate: datasource=pypi depName=ruff
          RUFF: "0.17.1"
        run: python3 -m pip install "yamllint==$YAMLLINT" "ruff==$RUFF"
      - name: Yamllint
        run: yamllint --strict .
      - name: Ruff
        run: ruff check tests
      - name: Shellcheck
        run: bash packaging/shellcheck-all.sh
      - name: Documentation links
        run: python3 packaging/check-doc-links.py .
      - name: Vendored standard has not drifted
        run: python3 packaging/check-standard-sync.py
      - name: .gitignore contains the shared base
        run: python3 packaging/check-gitignore-base.py .

  test:
    name: Test on Home Assistant ${{ matrix.target }}
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: floor
            python: "3.12"
          - target: latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        env:
          # renovate: datasource=pypi depName=uv
          UV: "0.12.5"
        run: python3 -m pip install "uv==$UV"
      - name: Test
        env:
          UV_PYTHON_DOWNLOADS: never
        run: bash packaging/run-tests.sh "${{ matrix.target }}"
