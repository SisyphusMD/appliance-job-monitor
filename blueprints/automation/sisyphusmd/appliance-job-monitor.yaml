blueprint:
  name: Appliance job monitor
  author: SisyphusMD
  description: >-
    Tracks a washer, dryer, dishwasher or similar appliance through its jobs from the power
    reading of the smart plug it is connected to, and runs your actions when a job starts or
    finishes.


    The state is kept in an `input_select` helper you create, which must contain the state
    labels below.
  domain: automation
  source_url: https://github.com/SisyphusMD/appliance-job-monitor/releases/latest/download/appliance-job-monitor.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    appliance:
      name: Appliance
      icon: mdi:washing-machine
      input:
        power_sensor:
          name: Power sensor
          description: The plug's power reading, in watts.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        state_select:
          name: State helper
          description: >-
            The `input_select` that holds this appliance's state. Its options must include
            every state label.
          selector:
            entity:
              filter:
                - domain: input_select
        plug_switch:
          name: Plug switch
          description: >-
            Optional. The plug's on/off switch, so a job switched off midway is paused rather than
            finished.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
    thresholds:
      name: Thresholds and timing
      icon: mdi:tune-variant
      input:
        start_threshold:
          name: Start threshold
          description: A job starts once power stays above this for the start delay.
          default: 5
          selector:
            number:
              min: 0
              max: 5000
              step: 0.1
              unit_of_measurement: W
              mode: box
        finish_threshold:
          name: Finish threshold
          description: >-
            A job finishes once power stays below this for the finish delay. Keep it below the
            start threshold.
          default: 3
          selector:
            number:
              min: 0
              max: 5000
              step: 0.1
              unit_of_measurement: W
              mode: box
        start_delay:
          name: Start delay
          description: How long power must stay above the start threshold.
          default:
            seconds: 0
          selector:
            duration: {}
        finish_delay:
          name: Finish delay
          description: >-
            How long power must stay below the finish threshold. Raise it for appliances that
            pause during a cycle, such as a dishwasher drying.
          default:
            seconds: 10
          selector:
            duration: {}
        resume_grace:
          name: Resume grace
          description: >-
            After the plug is switched back on, how long a paused job has to draw power again
            before it is given up as abandoned.
          default:
            minutes: 5
          selector:
            duration: {}
    labels:
      name: State labels
      icon: mdi:label-outline
      collapsed: true
      input:
        label_idle:
          name: Idle
          default: idle
          selector:
            text: {}
        label_running:
          name: Running
          default: job_ongoing
          selector:
            text: {}
        label_paused:
          name: Paused
          default: paused
          selector:
            text: {}
        label_completed:
          name: Completed
          default: job_completed
          selector:
            text: {}
        label_unplugged:
          name: Unplugged
          default: unplugged
          selector:
            text: {}
    actions:
      name: Actions
      icon: mdi:play-box-multiple-outline
      collapsed: true
      input:
        on_job_started:
          name: When a job starts
          default: []
          selector:
            action: {}
        on_job_resumed:
          name: When a paused job resumes
          default: []
          selector:
            action: {}
        on_job_completed:
          name: When a job finishes
          default: []
          selector:
            action: {}
        on_paused:
          name: When a running job is switched off
          default: []
          selector:
            action: {}
        on_abandoned:
          name: When a paused job never resumes
          default: []
          selector:
            action: {}
        on_unplugged:
          name: When the plug is switched off with no job running
          default: []
          selector:
            action: {}

# Queued rather than restart: a restart would cancel a user's action midway whenever the next power
# reading arrived. A trigger can therefore wait behind a slow action or a re-check, so triggers that
# claim something lasted (power high, power low, the plug on for the grace period) check it still
# holds when their run starts. Switch edges replay in order, since they record what happened.
mode: queued
max: 10
max_exceeded: silent

variables:
  power_sensor: !input power_sensor
  plug_switch: !input plug_switch
  start_threshold: !input start_threshold
  finish_threshold: !input finish_threshold

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input start_threshold
    for: !input start_delay
    id: power_high
  - trigger: numeric_state
    entity_id: !input power_sensor
    below: !input finish_threshold
    for: !input finish_delay
    id: power_low
  # Without a plug switch these watch no entity and never fire.
  - trigger: state
    entity_id: !input plug_switch
    to: "off"
    id: plug_off
  - trigger: state
    entity_id: !input plug_switch
    to: "on"
    id: plug_on
  - trigger: state
    entity_id: !input plug_switch
    to: "on"
    for: !input resume_grace
    id: plug_on_quiet
  # numeric_state fires only on a crossing, and a pending `for:` is dropped when triggers are
  # re-attached, so a reading already past a threshold at startup or reload would otherwise sit
  # unnoticed until the next crossing.
  - trigger: homeassistant
    event: start
    id: recheck
  - trigger: event
    event_type: automation_reloaded
    id: recheck
  # Turning the automation back on, or saving an edit to it, re-attaches its triggers while it
  # still reads off or unavailable, so this one fires when it switches on just after. A YAML
  # automation without an id has no state at that point, which is why the reload event stays.
  - trigger: template
    value_template: "{{ this is not none and is_state(this.entity_id, 'on') }}"
    id: recheck

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: power_high
          - condition: numeric_state
            entity_id: !input power_sensor
            above: !input start_threshold
          - condition: state
            entity_id: !input state_select
            state: !input label_paused
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          - sequence: !input on_job_resumed
      - conditions:
          - condition: trigger
            id: power_high
          - condition: numeric_state
            entity_id: !input power_sensor
            above: !input start_threshold
          - condition: not
            conditions:
              - condition: state
                entity_id: !input state_select
                state: !input label_running
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          # After the state write, so an action that fails cannot leave the state behind.
          - sequence: !input on_job_started
      # Only a running job can finish, so the 0 W that follows switching the plug off can never
      # pass for a completed job, whichever of the two the plug reports first.
      - conditions:
          - condition: trigger
            id: power_low
          - condition: numeric_state
            entity_id: !input power_sensor
            below: !input finish_threshold
          - condition: state
            entity_id: !input state_select
            state: !input label_running
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_completed
          - sequence: !input on_job_completed
      - conditions:
          - condition: trigger
            id: plug_off
          - condition: state
            entity_id: !input state_select
            state: !input label_running
        sequence: &pause
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_paused
          - sequence: !input on_paused
      - conditions:
          - condition: trigger
            id: plug_off
          - condition: state
            entity_id: !input state_select
            state:
              - !input label_idle
              - !input label_completed
        sequence: &unplug
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_unplugged
          - sequence: !input on_unplugged
      - conditions:
          - condition: trigger
            id: plug_on
          - condition: state
            entity_id: !input state_select
            state: !input label_unplugged
        sequence: &replug
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_idle
      # A paused job resumes through power_high. One still paused once the plug has been back on
      # for the whole grace period did not finish, so it is never reported as completed.
      - conditions:
          - condition: trigger
            id: plug_on_quiet
          - condition: state
            entity_id: !input state_select
            state: !input label_paused
          - condition: state
            entity_id: !input plug_switch
            state: "on"
            for: !input resume_grace
        sequence: &abandon
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_idle
          - sequence: !input on_abandoned
      # The transitions above, re-derived from the current readings. A plug switch read as off
      # wins, as its own trigger would have. Each wait gives up the moment the reading stops
      # passing its threshold, including landing exactly on it or going unavailable, so it is as
      # strict as the `for:` it stands in for, and the moment the plug is switched off, so that
      # edge is applied in order after this run.
      - conditions:
          - condition: trigger
            id: recheck
          - condition: template
            value_template: "{{ plug_switch is string and is_state(plug_switch, 'off') }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input state_select
                    state: !input label_running
                sequence: *pause
              - conditions:
                  - condition: state
                    entity_id: !input state_select
                    state:
                      - !input label_idle
                      - !input label_completed
                sequence: *unplug
      - conditions:
          - condition: trigger
            id: recheck
          - condition: not
            conditions:
              - condition: state
                entity_id: !input state_select
                state:
                  - !input label_running
                  - !input label_paused
          - condition: numeric_state
            entity_id: !input power_sensor
            above: !input start_threshold
        sequence:
          - wait_template: &start_broken >-
              {{ (plug_switch is string and is_state(plug_switch, 'off'))
                 or not (states(power_sensor) | is_number
                         and states(power_sensor) | float > start_threshold) }}
            timeout: !input start_delay
          - condition: template
            value_template: &start_held "{{ not wait.completed }}"
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          - sequence: !input on_job_started
      - conditions:
          - condition: trigger
            id: recheck
          - condition: state
            entity_id: !input state_select
            state: !input label_running
          - condition: numeric_state
            entity_id: !input power_sensor
            below: !input finish_threshold
        sequence:
          - wait_template: >-
              {{ (plug_switch is string and is_state(plug_switch, 'off'))
                 or not (states(power_sensor) | is_number
                         and states(power_sensor) | float < finish_threshold) }}
            timeout: !input finish_delay
          - condition: template
            value_template: *start_held
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_completed
          - sequence: !input on_job_completed
      - conditions:
          - condition: trigger
            id: recheck
          - condition: state
            entity_id: !input state_select
            state: !input label_unplugged
        sequence: *replug
      # How long the plug has already been on is unknown here, so the paused job gets a full
      # grace period from now, after any resume already under way has had its start delay.
      - conditions:
          - condition: trigger
            id: recheck
          - condition: state
            entity_id: !input state_select
            state: !input label_paused
        sequence:
          - if:
              - condition: numeric_state
                entity_id: !input power_sensor
                above: !input start_threshold
            then:
              - wait_template: *start_broken
                timeout: !input start_delay
              - if:
                  - condition: template
                    value_template: *start_held
                then:
                  - action: input_select.select_option
                    target:
                      entity_id: !input state_select
                    data:
                      option: !input label_running
                  - sequence: !input on_job_resumed
                  - stop: Resumed
              # A condition here would end only this branch of the `if`, not the run.
              - if:
                  - condition: template
                    value_template: "{{ plug_switch is string and is_state(plug_switch, 'off') }}"
                then:
                  - stop: Switched off
          - wait_for_trigger:
              - trigger: numeric_state
                entity_id: !input power_sensor
                above: !input start_threshold
                for: !input start_delay
              - trigger: state
                entity_id: !input plug_switch
                to: "off"
            timeout: !input resume_grace
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                sequence: *abandon
              - conditions:
                  - condition: numeric_state
                    entity_id: !input power_sensor
                    above: !input start_threshold
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input state_select
                    data:
                      option: !input label_running
                  - sequence: !input on_job_resumed
