blueprint:
  name: Appliance job monitor
  author: SisyphusMD
  description: >-
    Tracks a washer, dryer, dishwasher or similar appliance through its jobs from the power
    reading of the smart plug it is connected to, and runs your actions when a job starts or
    finishes.


    The state is kept in a dropdown (`input_select`) helper you create, with the six state
    options listed under State helper.
  domain: automation
  source_url: https://github.com/SisyphusMD/appliance-job-monitor/releases/latest/download/appliance-job-monitor.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    appliance:
      name: Appliance
      icon: mdi:washing-machine
      input:
        power_sensor:
          name: Power sensor
          description: The plug's power reading, in watts.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        state_select:
          name: State helper
          description: >-
            A dropdown helper (`input_select`) to hold this appliance's state, with these options:
            idle, job_ongoing, paused, job_completed, unplugged, detached_overload (or your own
            state labels, if you change them below).
          selector:
            entity:
              filter:
                - domain: input_select
        plug_switch:
          name: Plug switch
          description: >-
            Optional. The plug's on/off switch, so a job switched off midway is paused rather than
            finished.
          default: []
          selector:
            entity:
              filter:
                - domain: switch
        overload_sensor:
          name: Overload sensor
          description: >-
            Optional. A binary sensor that turns on when the plug trips on overload, so the job
            is marked as cut off by the trip.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
    thresholds:
      name: Thresholds and timing
      icon: mdi:tune-variant
      input:
        start_threshold:
          name: Start threshold
          description: A job starts once power stays above this for the start delay.
          default: 5
          selector:
            number:
              min: 0
              max: 5000
              step: 0.1
              unit_of_measurement: W
              mode: box
        finish_threshold:
          name: Finish threshold
          description: >-
            A job finishes once power stays below this for the finish delay. Keep it below the
            start threshold.
          default: 3
          selector:
            number:
              min: 0
              max: 5000
              step: 0.1
              unit_of_measurement: W
              mode: box
        start_delay:
          name: Start delay
          description: How long power must stay above the start threshold.
          default:
            seconds: 0
          selector:
            duration: {}
        finish_delay:
          name: Finish delay
          description: >-
            How long power must stay below the finish threshold. Raise it for appliances that
            pause during a cycle, such as a dishwasher drying.
          default:
            seconds: 10
          selector:
            duration: {}
        resume_grace:
          name: Resume grace
          description: >-
            After the plug is switched back on or an overload clears, how long an interrupted job
            has to draw power again before it is given up as abandoned.
          default:
            minutes: 5
          selector:
            duration: {}
    labels:
      name: State labels
      icon: mdi:label-outline
      collapsed: true
      input:
        label_idle:
          name: Idle
          default: idle
          selector:
            text: {}
        label_running:
          name: Running
          default: job_ongoing
          selector:
            text: {}
        label_paused:
          name: Paused
          default: paused
          selector:
            text: {}
        label_completed:
          name: Completed
          default: job_completed
          selector:
            text: {}
        label_unplugged:
          name: Unplugged
          default: unplugged
          selector:
            text: {}
        label_overload:
          name: Cut off by overload
          default: detached_overload
          selector:
            text: {}
    actions:
      name: Actions
      icon: mdi:play-box-multiple-outline
      collapsed: true
      input:
        on_job_started:
          name: When a job starts
          default: []
          selector:
            action: {}
        on_job_resumed:
          name: When a paused job resumes
          default: []
          selector:
            action: {}
        on_job_completed:
          name: When a job finishes
          default: []
          selector:
            action: {}
        on_paused:
          name: When a running job is switched off
          default: []
          selector:
            action: {}
        on_abandoned:
          name: When a paused job never resumes
          default: []
          selector:
            action: {}
        on_unplugged:
          name: When the plug is switched off with no job running
          default: []
          selector:
            action: {}
        on_overload:
          name: When an overload cuts off a job
          default: []
          selector:
            action: {}

# Queued rather than restart: a restart would cancel a user's action midway whenever the next power
# reading arrived. Runs apply triggers in the order they fired, so a slow action delays later
# transitions without changing them. That holds because no run waits through a change a queued
# trigger could act on: every wait below ends on one, then leaves it to that trigger's own run.
mode: queued
max: 10
max_exceeded: silent

variables:
  power_sensor: !input power_sensor
  plug_switch: !input plug_switch
  overload_sensor: !input overload_sensor
  start_threshold: !input start_threshold
  finish_threshold: !input finish_threshold
  state_select: !input state_select
  labels:
    Idle: !input label_idle
    Running: !input label_running
    Paused: !input label_paused
    Completed: !input label_completed
    Unplugged: !input label_unplugged
    Cut off by overload: !input label_overload
  problems: >-
    {% set options = state_attr(state_select, 'options') %}
    {% set chosen = labels.values() | list %}
    {% set ns = namespace(out=[]) %}
    {% if options is none %}
      {% set ns.out = ns.out + ['The state helper ' ~ state_select ~ ' was not found.'] %}
    {% else %}
      {% set missing = chosen | reject('in', options) | unique(case_sensitive=true) | list %}
      {% if missing %}
        {% set ns.out = ns.out + ['Add these options to ' ~ state_select ~ ': ' ~ missing | join(', ')] %}
      {% endif %}
    {% endif %}
    {% if chosen | unique(case_sensitive=true) | list | count < chosen | count %}
      {% set ns.out = ns.out + ['Each state label must be different.'] %}
    {% endif %}
    {% if finish_threshold >= start_threshold %}
      {% set ns.out = ns.out + ['The finish threshold (' ~ finish_threshold
                                ~ ' W) must be below the start threshold (' ~ start_threshold ~ ' W).'] %}
    {% endif %}
    {{ ns.out }}
  notification_id: "appliance_job_monitor_{{ this.entity_id if this else 'unknown' }}"

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input start_threshold
    for: !input start_delay
    id: power_high
  - trigger: numeric_state
    entity_id: !input power_sensor
    below: !input finish_threshold
    for: !input finish_delay
    id: power_low
  # Without a plug switch or overload sensor these watch no entity and never fire.
  - trigger: state
    entity_id: !input plug_switch
    to: "off"
    id: plug_off
  - trigger: state
    entity_id: !input plug_switch
    to: "on"
    id: plug_on
  - trigger: state
    entity_id: !input plug_switch
    to: "on"
    for: !input resume_grace
    id: plug_on_quiet
  - trigger: state
    entity_id: !input overload_sensor
    to: "on"
    id: overload_on
  - trigger: state
    entity_id: !input overload_sensor
    to: "off"
    id: overload_off
  - trigger: state
    entity_id: !input overload_sensor
    to: "off"
    for: !input resume_grace
    id: overload_off_quiet
  # numeric_state fires only on a crossing, and a pending `for:` is dropped when triggers are
  # re-attached, so a reading already past a threshold at startup or reload would otherwise sit
  # unnoticed until the next crossing.
  - trigger: homeassistant
    event: start
    id: recheck
  - trigger: event
    event_type: automation_reloaded
    id: recheck
  # Turning the automation back on, or saving an edit to it, re-attaches its triggers while it
  # still reads off or unavailable, so this one fires when it switches on just after. A YAML
  # automation without an id has no state at that point, which is why the reload event stays.
  - trigger: template
    value_template: "{{ this is not none and is_state(this.entity_id, 'on') }}"
    id: recheck
  # Editing the helper's options can make a configuration valid or invalid.
  - trigger: state
    entity_id: !input state_select
    attribute: options
    id: recheck

actions:
  # A broken configuration writes nothing. It is reported once per re-check rather than on every
  # power reading, so dismissing the notification is not undone until something changes.
  - if:
      - condition: template
        value_template: "{{ problems | count > 0 }}"
    then:
      - if:
          - condition: trigger
            id: recheck
        then:
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "{{ this.attributes.friendly_name if this else 'Appliance job monitor' }} is not running"
              message: "{{ problems | join('\n\n') }}"
      - stop: Invalid configuration
  - if:
      - condition: trigger
        id: recheck
    then:
      - action: persistent_notification.dismiss
        data:
          notification_id: "{{ notification_id }}"
  - choose:
      - conditions:
          - condition: trigger
            id: power_high
          - condition: state
            entity_id: !input state_select
            state: &interrupted
              - !input label_paused
              - !input label_overload
        sequence: &resume
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          - sequence: !input on_job_resumed
      - conditions:
          - condition: trigger
            id: power_high
          - condition: not
            conditions:
              - condition: state
                entity_id: !input state_select
                state: !input label_running
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          # After the state write, so an action that fails cannot leave the state behind.
          - sequence: !input on_job_started
      # Only a running job can finish, so the 0 W that follows switching the plug off can never
      # pass for a completed job, whichever of the two the plug reports first.
      - conditions:
          - condition: trigger
            id: power_low
          - condition: state
            entity_id: !input state_select
            state: !input label_running
        sequence:
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_completed
          - sequence: !input on_job_completed
      - conditions:
          - condition: trigger
            id: plug_off
          - condition: state
            entity_id: !input state_select
            state: !input label_running
        sequence: &pause
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_paused
          - sequence: !input on_paused
      - conditions:
          - condition: trigger
            id: plug_off
          - condition: state
            entity_id: !input state_select
            state:
              - !input label_idle
              - !input label_completed
        sequence: &unplug
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_unplugged
          - sequence: !input on_unplugged
      - conditions:
          - condition: trigger
            id: plug_on
          - condition: state
            entity_id: !input state_select
            state: !input label_unplugged
          - condition: template
            value_template: "{{ not (overload_sensor is string and is_state(overload_sensor, 'on')) }}"
        sequence: &replug
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_idle
      # An interrupted job resumes through power_high. One still interrupted once the plug has been
      # back on and any overload clear for the whole grace period did not finish, so it is never
      # reported as completed. Whichever of the two came last ends the grace; an entity that is not
      # configured passes its check.
      - conditions:
          - condition: trigger
            id:
              - plug_on_quiet
              - overload_off_quiet
          - condition: state
            entity_id: !input state_select
            state: *interrupted
          - condition: state
            entity_id: !input plug_switch
            state: "on"
            for: !input resume_grace
          - condition: state
            entity_id: !input overload_sensor
            state: "off"
            for: !input resume_grace
        sequence: &abandon
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_idle
          - sequence: !input on_abandoned
      # An overload outranks the plug switch: a job cut off by a trip stays in that state through
      # any switching until it resumes or is abandoned.
      - conditions:
          - condition: trigger
            id: overload_on
          - condition: state
            entity_id: !input state_select
            state:
              - !input label_running
              - !input label_paused
        sequence: &trip
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_overload
          - sequence: !input on_overload
      - conditions:
          - condition: trigger
            id: overload_on
          - condition: state
            entity_id: !input state_select
            state:
              - !input label_idle
              - !input label_completed
        sequence: *unplug
      # Power that never stopped, from an overload sensor that does not cut the plug, crosses no
      # threshold for power_high to see, so it is checked here.
      - conditions:
          - condition: trigger
            id: overload_off
          - condition: state
            entity_id: !input state_select
            state: !input label_overload
          - condition: numeric_state
            entity_id: !input power_sensor
            above: !input start_threshold
        sequence:
          - wait_template: &start_broken >-
              {{ (plug_switch is string and is_state(plug_switch, 'off'))
                 or (overload_sensor is string and is_state(overload_sensor, 'on'))
                 or not (states(power_sensor) | is_number
                         and states(power_sensor) | float > start_threshold) }}
            timeout: !input start_delay
          - condition: template
            value_template: &start_held "{{ not wait.completed }}"
          - sequence: *resume
      - conditions:
          - condition: trigger
            id: overload_off
          - condition: state
            entity_id: !input state_select
            state: !input label_unplugged
          - condition: template
            value_template: "{{ not (plug_switch is string and is_state(plug_switch, 'off')) }}"
        sequence:
          - sequence: *replug
          - condition: numeric_state
            entity_id: !input power_sensor
            above: !input start_threshold
          - wait_template: *start_broken
            timeout: !input start_delay
          - condition: template
            value_template: *start_held
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          - sequence: !input on_job_started
      # The transitions above, re-derived from the current readings. An overload or a plug switch
      # read as off wins, as its own trigger would have, in that order. Each wait gives up the
      # moment the reading stops passing its threshold, including landing exactly on it or going
      # unavailable, so it is as strict as the `for:` it stands in for, and the moment the plug is
      # switched off or trips, so that edge is applied in order after this run.
      - conditions:
          - condition: trigger
            id: recheck
          - condition: template
            value_template: &tripped "{{ overload_sensor is string and is_state(overload_sensor, 'on') }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input state_select
                    state:
                      - !input label_running
                      - !input label_paused
                sequence: *trip
              - conditions:
                  - condition: state
                    entity_id: !input state_select
                    state:
                      - !input label_idle
                      - !input label_completed
                sequence: *unplug
      - conditions:
          - condition: trigger
            id: recheck
          - condition: template
            value_template: &plug_is_off "{{ plug_switch is string and is_state(plug_switch, 'off') }}"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input state_select
                    state: !input label_running
                sequence: *pause
              - conditions:
                  - condition: state
                    entity_id: !input state_select
                    state:
                      - !input label_idle
                      - !input label_completed
                sequence: *unplug
      - conditions:
          - condition: trigger
            id: recheck
          - condition: not
            conditions:
              - condition: state
                entity_id: !input state_select
                state:
                  - !input label_running
                  - !input label_paused
                  - !input label_overload
          - condition: numeric_state
            entity_id: !input power_sensor
            above: !input start_threshold
        sequence:
          - wait_template: *start_broken
            timeout: !input start_delay
          - condition: template
            value_template: *start_held
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_running
          - sequence: !input on_job_started
      - conditions:
          - condition: trigger
            id: recheck
          - condition: state
            entity_id: !input state_select
            state: !input label_running
          - condition: numeric_state
            entity_id: !input power_sensor
            below: !input finish_threshold
        sequence:
          - wait_template: >-
              {{ (plug_switch is string and is_state(plug_switch, 'off'))
                 or (overload_sensor is string and is_state(overload_sensor, 'on'))
                 or not (states(power_sensor) | is_number
                         and states(power_sensor) | float < finish_threshold) }}
            timeout: !input finish_delay
          - condition: template
            value_template: *start_held
          - action: input_select.select_option
            target:
              entity_id: !input state_select
            data:
              option: !input label_completed
          - sequence: !input on_job_completed
      - conditions:
          - condition: trigger
            id: recheck
          - condition: state
            entity_id: !input state_select
            state: !input label_unplugged
        sequence: *replug
      # How long the plug has already been on, or the overload clear, is unknown here, so the
      # interrupted job gets a full grace period from now, after any resume already under way has
      # had its start delay.
      - conditions:
          - condition: trigger
            id: recheck
          - condition: state
            entity_id: !input state_select
            state: *interrupted
        sequence:
          - if:
              - condition: numeric_state
                entity_id: !input power_sensor
                above: !input start_threshold
            then:
              - wait_template: *start_broken
                timeout: !input start_delay
              - if:
                  - condition: template
                    value_template: *start_held
                then:
                  - sequence: *resume
                  - stop: Resumed
              # A condition here would end only this branch of the `if`, not the run.
              - if:
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: *plug_is_off
                      - condition: template
                        value_template: *tripped
                then:
                  - stop: Interrupted again
          # Each of these also fires a trigger of this automation, whose run queued behind this
          # one applies it, so this run only has to stop waiting.
          - wait_for_trigger:
              - trigger: numeric_state
                entity_id: !input power_sensor
                above: !input start_threshold
                for: !input start_delay
              - trigger: state
                entity_id: !input plug_switch
                to: "off"
              - trigger: state
                entity_id: !input overload_sensor
                to: "on"
            timeout: !input resume_grace
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then: *abandon
