name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # Forgejo has no rerun API, so without this a transient runner fault leaves main red with no way
  # back except an unrelated commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and repository checks
    # Trusted-ref gate: this runner is self-hosted and `pull_request` fires for forks too, so without
    # this a fork's PR would run its own code on the owner's hardware. Fork PRs are covered by
    # GitHub's hosted runners instead (.github/workflows/ci-pr.yml).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step, guarded on `!= 'success'` rather than `== 'failure'`: an unset outcome must
      # retry, or `continue-on-error` would swallow the first failure and later steps would run
      # against whatever interpreter happened to be present.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Install the linters
        # One annotation per pin, each directly above its own value, so Renovate pairs them right.
        env:
          # renovate: datasource=pypi depName=yamllint
          YAMLLINT: "1.37.1"
          # renovate: datasource=pypi depName=ruff
          RUFF: "0.17.1"
        run: python3 -m pip install "yamllint==$YAMLLINT" "ruff==$RUFF"
      - name: Yamllint
        run: yamllint --strict .
      - name: Ruff
        run: ruff check tests
      - name: Shellcheck
        run: bash packaging/shellcheck-all.sh
      - name: Documentation links
        run: python3 packaging/check-doc-links.py .
      - name: Vendored standard has not drifted
        # A shared helper improved by editing the copy here never reaches the other projects. Change
        # it in project-standard and re-vendor.
        run: python3 packaging/check-standard-sync.py
      - name: .gitignore contains the shared base
        run: python3 packaging/check-gitignore-base.py .

  test:
    name: Test on Home Assistant ${{ matrix.target }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The blueprint's declared minimum and the newest release; packaging/run-tests.sh says
          # which Home Assistant each one installs.
          - target: floor
            python: "3.12"
          - target: latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python
        continue-on-error: true
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python.outcome != 'success'
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        env:
          # renovate: datasource=pypi depName=uv
          UV: "0.12.5"
        run: python3 -m pip install "uv==$UV"
      - name: Test
        env:
          # The interpreter setup-python just installed, never one uv fetches on its own.
          UV_PYTHON_DOWNLOADS: never
        run: bash packaging/run-tests.sh "${{ matrix.target }}"
